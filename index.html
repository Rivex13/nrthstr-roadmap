    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, keyMaterial, 384);
    var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, body);
    var html = new TextDecoder().decode(plain);
    if (html.slice(0, 15).toLowerCase() !== "<!doctype html>") throw new Error("bad password");
    return html;
  }
  async function open(password, remember) {
    var html = await decrypt(password);
    try { sessionStorage.setItem("ns_pw", password); if (remember) localStorage.setItem("ns_pw", password); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  var f = document.getElementById("f"), err = document.getElementById("err");
  f.addEventListener("submit", function (ev) {
    ev.preventDefault(); err.textContent = "";
    open(document.getElementById("pw").value, document.getElementById("keep").checked).catch(function () { err.textContent = "Неверный пароль"; });
  });
  try {
    var saved = sessionStorage.getItem("ns_pw") || localStorage.getItem("ns_pw");
    if (saved) open(saved, false).catch(function () { try { localStorage.removeItem("ns_pw"); sessionStorage.removeItem("ns_pw"); } catch (e) {} });
  } catch (e) {}
})();
</script>
